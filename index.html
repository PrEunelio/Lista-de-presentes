<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7b5b3a">
<title>Lista de Presentes</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f3ee;color:#302a25}
header{background:linear-gradient(135deg,#8a6847,#5f4935);color:#fff;padding:34px 18px 28px;text-align:center}
header h1{margin:0 0 8px;font-family:Georgia,serif;font-size:30px}
header p{margin:0;opacity:.92;font-size:15px}
.wrap{max-width:850px;margin:0 auto;padding:18px 14px 42px}
.controls{position:sticky;top:0;z-index:5;background:#f7f3ee;padding:10px 0}
.search{width:100%;border:1px solid #d8cec3;border-radius:12px;padding:13px 14px;font-size:16px;background:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding-top:9px}
.filters button{border:1px solid #d8cec3;background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:13px}
.filters button.active{background:#5f4935;color:#fff;border-color:#5f4935}
.room{margin:24px 0 10px;font-family:Georgia,serif;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5ddd5;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(50,35,20,.06)}
.photo{height:170px;background:#eee8e1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;background:#fff}
.placeholder{font-size:42px;opacity:.55}
.content{padding:13px}
.item{font-weight:700;font-size:16px;line-height:1.25;margin-bottom:7px}
.spec,.brands{font-size:13px;line-height:1.4;color:#665d55;margin:5px 0}
.badge{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#e8f4e8;color:#2d6b35}
.badge.res{background:#fff1cf;color:#805d14}
.badge.giv{background:#eee;color:#666}
a.btn{display:block;text-align:center;margin-top:10px;padding:10px;border-radius:10px;background:#5f4935;color:#fff;text-decoration:none;font-weight:700;font-size:13px}
.empty{text-align:center;padding:35px 10px;color:#766c63;display:none}
footer{text-align:center;color:#857b72;font-size:12px;padding:20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:190px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🎁 Lista de Presentes</h1>
  <p>Escolha um presente para nossa nova casa</p>
</header>
<div class="wrap">
  <div class="controls">
    <input id="search" class="search" placeholder="🔎 Procurar um presente..." autocomplete="off">
    <div id="filters" class="filters"></div>
  </div>
  <div id="content"></div>
  <div id="empty" class="empty">Nenhum presente encontrado.</div>
</div>
<footer>Lista de presentes</footer>
<script>

ntina; Mundial; Brinox", "status": "Disponível", "person": "", "link": "", "image": "https://assets.tramontina.com.br/upload/tramon/imagens/CUT/22299026PNM001G.png"}, {"room": "Cozinha", "item": "Item de cozinha Brinox", "spec": "Última linha da página está parcialmente cortada/ilegível", "brands": "Brinox; Tramontina", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Ferro de passar roupa", "spec": "A vapor", "brands": "Philips Walita; Black+Decker; Electrolux; Oster", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Panela de pressão elétrica", "spec": "", "brands": "Electrolux; Midea; Philips Walita; Mondial", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Tábua de passar roupa", "spec": "", "brands": "Tramontina; Mor; Açomix", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Liquidificador", "spec": "Preferência anotada: Britânia / Walita", "brands": "Philips Walita; Oster; Electrolux; Britânia", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Batedeira", "spec": "", "brands": "KitchenAid; Oster; Electrolux; Arno; Philips Walita", "status": "Disponível", "person": "", "link": "", "image": "https://osterbrasil.vteximg.com.br/arquivos/ppOBAT641-01m.jpg?v=638156928964300000"}, {"room": "Eletrodomésticos", "item": "Grill", "spec": "", "brands": "Philips Walita; Oster; Electrolux; Mondial", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Pipoqueira elétrica", "spec": "", "brands": "Mondial; Britânia; Cadence; Oster", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Depurador (Suggar) para fogão de 5 bocas", "spec": "Preto", "brands": "Suggar; Electrolux; Midea; Fischer", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Climatizador", "spec": "", "brands": "Midea; Elgin; Britânia; Mondial", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Ventilador", "spec": "Preferência anotada: Arno", "brands": "Arno; Mondial; Britânia; WAP", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Eletrodomésticos", "item": "Air fryer", "spec": "", "brands": "Philips Walita; Oster; Electrolux; Mondial; Midea", "status": "Disponível", "person": "", "link": "", "image": "https://walitastore.vtexassets.com/arquivos/ids/162615/NA341_13.png.png?v=638926768852830000"}, {"room": "Eletrodomésticos", "item": "Forno elétrico", "spec": "Preto", "brands": "Fischer; Electrolux; Oster; Philco; Brastemp", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Jogo de cama / lençol", "spec": "", "brands": "Karsten; Buddemeyer; Artex; Santista; Altenburg", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Jogo de lençol de casal", "spec": "Casal", "brands": "Karsten; Buddemeyer; Artex; Santista; Altenburg", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Travesseiros", "spec": "Kit com 2 unidades", "brands": "Duoflex; Altenburg; Buddemeyer; NASA", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Cobre-leito de casal", "spec": "Conforme anotação", "brands": "Buddemeyer; Karsten; Artex; Altenburg", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Colcha de casal", "spec": "Conforme anotação", "brands": "Karsten; Buddemeyer; Artex; Santista", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Cesto de roupa suja", "spec": "Preto", "brands": "Tramontina; Brinox; Ou; Arthi", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Cortina blackout", "spec": "Branca — 130 x 130, conforme anotação", "brands": "Bella Janela; Santista; Sultan; Döhler", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Quarto", "item": "Cortina blackout", "spec": "Azul — 130 x 130, conforme anotação", "brands": "Bella Janela; Santista; Sultan; Döhler", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Sala", "item": "Tapete grande", "spec": "Para sala", "brands": "Tapetes São Carlos; Corttex; Jolitex; Sultan", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Sala", "item": "Manta para sofá", "spec": "Sofá de 3 lugares + 4 travesseiros/almofadas, conforme anotação", "brands": "Karsten; Buddemeyer; Jolitex; Zelo", "status": "Disponível", "person": "", "link": "", "image": ""}, {"room": "Sala", "item": "Toalha de mesa", "spec": "Para mesa de 6 cadeiras", "brands": "Karsten; Döhler; Copa & Cia; Teka", "status": "Disponível", "person": "", "link": "", "image": ""}];
const content = document.getElementById('content');
const filters = document.getElementById('filters');
const search = document.getElementById('search');
const empty = document.getElementById('empty');
let active = 'Todos';

const rooms = ['Todos', ...new Set(items.map(x => x.room || 'Outros'))];
rooms.forEach(room => {
  const b=document.createElement('button');
  b.textContent=room;
  b.className=room==='Todos'?'active':'';
  b.onclick=()=>{active=room; [...filters.children].forEach(x=>x.classList.remove('active')); b.classList.add('active'); render()};
  filters.appendChild(b);
});

function statusClass(s){
  s=(s||'').toLowerCase();
  if(s.includes('reserv')) return 'res';
  if(s.includes('presente')) return 'giv';
  return '';
}
function render(){
  const q=search.value.toLowerCase().trim();
  const filtered=items.filter(x=>{
    const text=[x.item,x.room,x.spec,x.brands].join(' ').toLowerCase();
    return (active==='Todos'||(x.room||'Outros')===active) && (!q||text.includes(q));
  });
  content.innerHTML='';
  empty.style.display=filtered.length?'none':'block';
  const groups={};
  filtered.forEach(x=>(groups[x.room||'Outros']??=[]).push(x));
  Object.entries(groups).forEach(([room,list])=>{
    const sec=document.createElement('section');
    sec.innerHTML='<div class="room">'+room+'</div><div class="grid"></div>';
    const grid=sec.querySelector('.grid');
    list.forEach(x=>{
      const card=document.createElement('article'); card.className='card';
      const ph=x.image?`<img src="${x.image}" alt="${x.item}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.placeholder').style.display='block'">`:'';
      card.innerHTML=`<div class="photo">${ph}<span class="placeholder" style="display:${x.image?'none':'block'}">📷</span></div>
        <div class="content">
          <div class="item">${escapeHtml(x.item)}</div>
          ${x.spec?`<div class="spec"><b>Preferência:</b> ${escapeHtml(x.spec)}</div>`:''}
          ${x.brands?`<div class="brands"><b>Marcas:</b> ${escapeHtml(x.brands)}</div>`:''}
          <span class="badge ${statusClass(x.status)}">${escapeHtml(x.status||'Disponível')}</span>
          ${x.link?`<a class="btn" href="${x.link}" target="_blank" rel="noopener">Ver referência do produto</a>`:''}
        </div>`;
      grid.appendChild(card);
    });
    content.appendChild(sec);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
