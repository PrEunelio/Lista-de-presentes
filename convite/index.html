<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>Anderson &amp; Gisele — Convite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f0e8;--ink:#314a35;--soft:#647463;--line:#aab5a6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--paper)}body{overflow:hidden;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
.page{position:relative;width:100%;max-width:560px;height:100dvh;min-height:680px;margin:auto;overflow:hidden;background:var(--paper)}
/* Foto: faixa superior com dissolução para o papel, como no modelo. */
.photo{position:absolute;z-index:0;left:0;top:0;width:100%;height:47%;object-fit:cover;object-position:center 25%;filter:saturate(.82) contrast(.95) brightness(1.04)}
.photoFade{position:absolute;z-index:1;left:0;right:0;top:0;height:59%;background:linear-gradient(to bottom,rgba(243,240,232,0) 0%,rgba(243,240,232,0) 40%,rgba(243,240,232,.12) 48%,rgba(243,240,232,.55) 63%,rgba(243,240,232,.92) 78%,var(--paper) 100%)}
.paperPanel{position:absolute;z-index:2;left:6.5%;right:6.5%;top:7.5%;bottom:4.5%;background:rgba(250,249,244,.18);border:1px solid rgba(80,99,82,.28);pointer-events:none}
.paperPanel:after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.52)}
.orn{position:absolute;z-index:3;pointer-events:none}.orn.top{top:-8px;right:-26px;width:43%;opacity:.82}.orn.bottom{bottom:-24px;left:-24px;width:42%;opacity:.72}.orn.side{bottom:1.5%;right:-28px;width:35%;opacity:.88}
.content{position:absolute;z-index:5;inset:0;text-align:center;padding:0 9%}
.kicker{margin:0;position:absolute;top:27.5%;left:0;width:100%;font:400 9px/1 'Montserrat',Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#718071}
.names{position:absolute;top:30.4%;left:0;width:100%;margin:0;color:#2f4934;font-family:'Playfair Display',Georgia,serif;font-size:clamp(42px,11.7vw,66px);font-weight:400;line-height:1.02;letter-spacing:.035em;text-transform:none}
.names .first,.names .second{display:block;white-space:nowrap}.names .amp{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;line-height:1;margin:4px 0 3px;letter-spacing:0}
.names:after{content:"";display:block;width:72px;height:1px;background:#a8b1a4;margin:12px auto 0}
.invite{position:absolute;top:48.8%;left:5%;width:90%;margin:0;color:#536454;font-size:clamp(21px,5.2vw,27px);line-height:1.08;font-weight:400}
.invite strong{display:block;font-weight:600;letter-spacing:.10em;text-transform:uppercase;font-size:.82em;margin-top:5px}
.dateBlock{position:absolute;top:59.8%;left:0;width:100%;color:#415641}
.dateWeek{display:flex;align-items:center;gap:14px;width:84%;margin:0 auto 10px;font:400 10px/1 'Montserrat',Arial,sans-serif;letter-spacing:.36em;text-transform:uppercase}.dateWeek:before,.dateWeek:after{content:"";height:1px;background:rgba(84,105,87,.45);flex:1}.dateWeek span{white-space:nowrap;margin-left:.36em}
.date{font-family:'Playfair Display',Georgia,serif;font-size:clamp(22px,5.7vw,31px);letter-spacing:.14em;text-transform:uppercase;line-height:1.05}
.year{margin-top:5px;font-family:'Playfair Display',Georgia,serif;font-size:clamp(56px,14vw,78px);line-height:.92;letter-spacing:.025em}
.time{margin-top:9px;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,5.5vw,30px);letter-spacing:.16em}.time:before{content:"";display:inline-block;width:52px;height:1px;background:rgba(84,105,87,.45);vertical-align:middle;margin-right:14px}.time:after{content:"";display:inline-block;width:52px;height:1px;background:rgba(84,105,87,.45);vertical-align:middle;margin-left:14px}
.button{position:absolute;top:83.6%;left:50%;transform:translateX(-50%);width:188px;padding:14px 18px;background:rgba(248,246,239,.96);border:1px solid rgba(69,91,72,.55);color:#405541;font:400 10px/1 'Montserrat',Arial,sans-serif;letter-spacing:.30em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 18px rgba(42,62,45,.08);z-index:8}.button:active{transform:translateX(-50%) scale(.98)}
.hint{position:absolute;top:90.8%;left:0;width:100%;margin:0;color:rgba(71,88,73,.55);font:300 7px/1 'Montserrat',Arial,sans-serif;letter-spacing:.20em;text-transform:uppercase}
.video-screen{display:none;position:fixed;inset:0;z-index:50;background:#111;align-items:center;justify-content:center}.video-screen.active{display:flex}video{width:100%;height:100%;object-fit:contain;background:#111}.back{position:absolute;z-index:52;top:max(18px,env(safe-area-inset-top));left:18px;border:1px solid rgba(255,255,255,.45);border-radius:50px;padding:9px 15px;color:#fff;background:rgba(0,0,0,.3);font:12px Arial,sans-serif}.open-pdf{position:absolute;z-index:55;left:50%;bottom:max(32px,calc(env(safe-area-inset-bottom) + 24px));transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:15px 43px;min-width:145px;border-radius:999px;border:1px solid rgba(83,105,86,.45);background:rgba(250,248,242,.97);color:#526653;text-decoration:none;text-align:center;font:500 15px Montserrat,Arial,sans-serif;letter-spacing:.16em;box-shadow:0 8px 30px rgba(0,0,0,.28);transition:opacity .35s,transform .35s}.open-pdf.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(max-height:760px){.kicker{top:25.2%}.names{top:28.2%;font-size:clamp(39px,11.3vw,62px)}.invite{top:46.2%;font-size:clamp(20px,5vw,25px)}.dateBlock{top:58%}.button{top:82.2%}.hint{top:90.2%}}
</style>
</head>
<body>
<section class="page" id="home">
<img class="photo" src="foto-casal.jpg" alt="">
<div class="photoFade"></div><div class="paperPanel"></div>
<img class="orn top" src="top_right.png" alt=""><img class="orn bottom" src="bottom_left.png" alt=""><img class="orn side" src="right_sprig.png" alt="">
<main class="content">
<p class="kicker">Nosso casamento</p>
<h1 class="names"><span class="first">Anderson</span><span class="amp">&amp;</span><span class="second">Gisele</span></h1>
<p class="invite">convidam para a celebração do seu<strong>casamento e festa comemorativa</strong></p>
<div class="dateBlock"><div class="dateWeek"><span>Sábado</span></div><div class="date">05 de dezembro</div><div class="year">2026</div><div class="time">19:00</div></div>
<button class="button" id="start">Toque aqui</button><p class="hint">Toque para assistir ao convite</p>
</main>
</section>
<section class="video-screen" id="videoScreen"><button class="back" id="back">Voltar</button><video id="video" playsinline controls preload="metadata"><source src="convite.mp4" type="video/mp4"></video><a class="open-pdf" id="pdfButton" href="convite.pdf" target="_blank" rel="noopener">Abrir</a></section>
<script>
const start=document.getElementById('start'),home=document.getElementById('home'),screen=document.getElementById('videoScreen'),video=document.getElementById('video'),pdfButton=document.getElementById('pdfButton'),back=document.getElementById('back');
function showOpen(){pdfButton.classList.add('show')}
start.addEventListener('click',()=>{home.style.display='none';screen.classList.add('active');pdfButton.classList.remove('show');video.pause();video.currentTime=0;video.load();const p=video.play();if(p)p.catch(()=>{})});
video.addEventListener('ended',showOpen);video.addEventListener('timeupdate',()=>{if(Number.isFinite(video.duration)&&video.duration>0&&video.currentTime>=video.duration-.2)showOpen()});
back.addEventListener('click',()=>{video.pause();screen.classList.remove('active');home.style.display='block';pdfButton.classList.remove('show')});
</script>
</body></html>
