<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Gisele & Anderson — Convite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#f4f1e8}
body{overflow:hidden;color:#394536;font-family:"Cormorant Garamond",Georgia,serif}
.page{position:relative;width:min(100vw,560px);height:100dvh;min-height:680px;margin:auto;overflow:hidden;background:#f4f1e8}

/* FOTO — mesma lógica visual do modelo: retrato forte em cima, dissolvido no papel */
.photo{
 position:absolute;inset:0 0 auto 0;width:100%;height:68%;
 object-fit:cover;object-position:center 27%;
 filter:saturate(.82) contrast(.93) brightness(1.03);
 transform:scale(1.018);
 z-index:0
}
.photoMix{
 position:absolute;inset:0;z-index:1;pointer-events:none;
 background:
   linear-gradient(180deg,rgba(248,246,239,0) 17%,
   rgba(248,246,239,.015) 27%,
   rgba(248,246,239,.16) 38%,
   rgba(248,246,239,.48) 49%,
   rgba(248,246,239,.82) 58%,
   rgba(248,246,239,.97) 67%,
   #f4f1e8 74%);
}
.photoGlow{
 position:absolute;left:0;right:0;top:28%;height:42%;z-index:1;pointer-events:none;
 background:radial-gradient(ellipse at 50% 65%,rgba(255,255,255,.46),rgba(255,255,255,0) 68%);
}
.frame{position:absolute;inset:14px;z-index:8;border:1px solid rgba(87,102,83,.30);pointer-events:none}
.frame:after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.48)}

/* ramos finos como os do modelo */
.branch{position:absolute;z-index:4;width:170px;height:270px;bottom:-24px;opacity:.58;pointer-events:none}
.branch.left{left:-36px;transform:rotate(-9deg)}
.branch.right{right:-36px;transform:scaleX(-1) rotate(-9deg)}
.branch svg{width:100%;height:100%}
.branch path,.branch ellipse{fill:none;stroke:#8d9788;stroke-width:1.1}
.branch .leaf{fill:#aab3a5;fill-opacity:.18}

/* conteúdo em posições equivalentes ao modelo */
.content{position:absolute;inset:0;z-index:7;text-align:center}
.kicker{
 position:absolute;top:30.7%;left:0;width:100%;
 margin:0;font-family:Montserrat,Arial,sans-serif;font-size:9px;letter-spacing:.46em;
 text-transform:uppercase;color:#697568;font-weight:300
}
.names{
 position:absolute;top:33.2%;left:4%;width:92%;
 margin:0;font-family:"Bodoni Moda","Times New Roman",serif;font-weight:400;
 font-size:clamp(57px,15vw,86px);line-height:.80;letter-spacing:-.055em;
 text-transform:uppercase;color:#334132;
 text-shadow:0 1px 1px rgba(255,255,255,.55)
}
.names .amp{
 display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:.40em;
 line-height:1.0;letter-spacing:0;margin:7px 0 3px;font-weight:500
}
.swirl{position:absolute;top:39.0%;left:50%;width:72%;height:100px;transform:translateX(-50%);z-index:-1;opacity:.62}
.swirl:before,.swirl:after{content:"";position:absolute;top:47px;width:47%;height:54px;border-top:1px solid #8d9587;border-radius:50%}
.swirl:before{left:0;transform:rotate(-7deg)}
.swirl:after{right:0;transform:rotate(7deg)}
.swirl span{position:absolute;left:50%;top:29px;width:1px;height:75px;background:#8d9587;transform:rotate(72deg)}

.invite{
 position:absolute;top:51.0%;left:5%;width:90%;margin:0;
 font-size:clamp(20px,5.5vw,27px);line-height:1.04;color:#485345
}
.invite strong{display:block;font-weight:500;letter-spacing:.075em;text-transform:uppercase;font-size:.90em;margin-top:3px}

.divider{
 position:absolute;top:64.2%;left:8%;width:84%;height:20px;
 display:flex;align-items:center;justify-content:center;gap:17px;color:#7c8778
}
.divider:before,.divider:after{content:"";height:1px;background:rgba(92,105,88,.48);flex:1}
.divider span{font-family:Montserrat,Arial,sans-serif;font-size:10px;letter-spacing:.42em;text-transform:uppercase;margin-left:.42em}

.date-line{
 position:absolute;top:67.0%;left:0;width:100%;margin:0;
 font-family:"Bodoni Moda","Times New Roman",serif;font-size:clamp(20px,5.2vw,28px);
 letter-spacing:.19em;color:#3c493a;text-transform:uppercase
}
.date-main{
 position:absolute;top:70.3%;left:0;width:100%;margin:0;
 font-family:"Bodoni Moda","Times New Roman",serif;font-size:clamp(65px,17vw,94px);
 line-height:.88;letter-spacing:.01em;color:#344132;font-weight:400
}
.time-row{
 position:absolute;top:80.1%;left:14%;width:72%;height:35px;
 display:flex;align-items:center;justify-content:center;gap:18px
}
.time-row:before,.time-row:after{content:"";height:1px;width:74px;background:rgba(92,105,88,.48)}
.time{font-family:"Bodoni Moda","Times New Roman",serif;font-size:23px;letter-spacing:.18em;color:#435040;margin-left:.18em}

.button{
 position:absolute;top:85.1%;left:50%;transform:translateX(-50%);
 min-width:182px;padding:15px 34px;border:1px solid rgba(75,89,73,.55);
 border-radius:0;background:rgba(248,246,238,.82);backdrop-filter:blur(3px);
 color:#435041;font-family:Montserrat,Arial,sans-serif;font-size:11px;font-weight:400;
 letter-spacing:.31em;text-transform:uppercase;cursor:pointer;
 box-shadow:0 7px 24px rgba(58,70,55,.13);z-index:9
}
.button:active{transform:translateX(-50%) scale(.98)}
.hint{
 position:absolute;top:91.4%;left:0;width:100%;margin:0;
 font-family:Montserrat,Arial,sans-serif;font-size:7px;letter-spacing:.22em;
 text-transform:uppercase;color:rgba(72,85,69,.53)
}

/* vídeo */
.video-screen{display:none;position:fixed;inset:0;z-index:20;background:#111;align-items:center;justify-content:center}
.video-screen.active{display:flex}
video{width:100%;height:100%;object-fit:contain;display:block;background:#111}
.back{position:absolute;z-index:22;top:max(18px,env(safe-area-inset-top));left:18px;border:1px solid rgba(255,255,255,.45);border-radius:50px;padding:9px 15px;color:white;background:rgba(0,0,0,.28);font-family:Arial,sans-serif;font-size:12px;cursor:pointer}
.open-pdf{
 position:absolute;z-index:30;left:50%;bottom:max(32px,calc(env(safe-area-inset-bottom) + 24px));
 transform:translate(-50%,18px);opacity:0;pointer-events:none;
 padding:15px 43px;min-width:145px;border-radius:999px;border:1px solid rgba(83,105,86,.45);
 background:rgba(250,248,242,.97);color:#526653;text-decoration:none;text-align:center;
 font-family:Montserrat,Arial,sans-serif;font-size:15px;font-weight:500;letter-spacing:.16em;
 box-shadow:0 8px 30px rgba(0,0,0,.28);transition:opacity .5s ease,transform .5s ease
}
.open-pdf.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(max-height:760px){
 .kicker{top:27.5%}.names{top:30%}.swirl{top:35.5%}.invite{top:47.5%}
 .divider{top:60%}.date-line{top:63.2%}.date-main{top:66.4%}.time-row{top:75.8%}
 .button{top:81.2%}.hint{top:89.2%}.photo{height:64%}
}
</style>
</head>
<body>
<section class="page" id="home">
<img class="photo" src="foto-casal.jpg" alt="" aria-hidden="true">
<div class="photoMix"></div><div class="photoGlow"></div>
<div class="frame"></div>

<div class="branch left" aria-hidden="true">
<svg viewBox="0 0 170 270">
<path d="M92 270 C72 222 82 176 68 126 C59 92 45 58 28 18"/>
<ellipse class="leaf" cx="39" cy="48" rx="24" ry="8" transform="rotate(44 39 48)"/>
<ellipse class="leaf" cx="68" cy="88" rx="26" ry="9" transform="rotate(-35 68 88)"/>
<ellipse class="leaf" cx="57" cy="123" rx="24" ry="8" transform="rotate(35 57 123)"/>
<ellipse class="leaf" cx="75" cy="162" rx="26" ry="9" transform="rotate(-35 75 162)"/>
<ellipse class="leaf" cx="70" cy="199" rx="24" ry="8" transform="rotate(35 70 199)"/>
<path d="M92 270 C103 225 121 192 145 162"/>
<ellipse class="leaf" cx="128" cy="184" rx="25" ry="8" transform="rotate(25 128 184)"/>
</svg>
</div>
<div class="branch right" aria-hidden="true">
<svg viewBox="0 0 170 270">
<path d="M92 270 C72 222 82 176 68 126 C59 92 45 58 28 18"/>
<ellipse class="leaf" cx="39" cy="48" rx="24" ry="8" transform="rotate(44 39 48)"/>
<ellipse class="leaf" cx="68" cy="88" rx="26" ry="9" transform="rotate(-35 68 88)"/>
<ellipse class="leaf" cx="57" cy="123" rx="24" ry="8" transform="rotate(35 57 123)"/>
<ellipse class="leaf" cx="75" cy="162" rx="26" ry="9" transform="rotate(-35 75 162)"/>
<ellipse class="leaf" cx="70" cy="199" rx="24" ry="8" transform="rotate(35 70 199)"/>
<path d="M92 270 C103 225 121 192 145 162"/>
<ellipse class="leaf" cx="128" cy="184" rx="25" ry="8" transform="rotate(25 128 184)"/>
</svg>
</div>

<main class="content">
<p class="kicker">Nosso casamento</p>
<h1 class="names">Gisele <span class="amp">&amp;</span> Anderson</h1>
<div class="swirl"><span></span></div>
<p class="invite">convidam para a celebração do seu<strong>casamento e festa comemorativa</strong></p>
<div class="divider"><span>Sábado</span></div>
<p class="date-line">05 de dezembro</p>
<p class="date-main">2026</p>
<div class="time-row"><span class="time">19:00</span></div>
<button class="button" id="start">Toque aqui</button>
<p class="hint">Toque para assistir ao convite</p>
</main>
</section>

<section class="video-screen" id="videoScreen">
<button class="back" id="back">Voltar</button>
<video id="video" playsinline controls preload="metadata"><source src="convite.mp4" type="video/mp4"></video>
<a class="open-pdf" id="pdfButton" href="convite.pdf" target="_blank" rel="noopener">Abrir</a>
</section>
<script>
const start=document.getElementById('start'),home=document.getElementById('home'),screen=document.getElementById('videoScreen'),video=document.getElementById('video'),pdfButton=document.getElementById('pdfButton'),back=document.getElementById('back');
function showOpen(){pdfButton.classList.add('show')}
start.addEventListener('click',()=>{
 home.style.display='none';screen.classList.add('active');pdfButton.classList.remove('show');
 video.pause();video.currentTime=0;video.load();const p=video.play();if(p)p.catch(()=>{});
});
video.addEventListener('ended',showOpen);
video.addEventListener('timeupdate',()=>{if(Number.isFinite(video.duration)&&video.duration>0&&video.currentTime>=video.duration-0.20)showOpen()});
back.addEventListener('click',()=>{video.pause();screen.classList.remove('active');home.style.display='block';pdfButton.classList.remove('show')});
</script>
</body>
</html>
