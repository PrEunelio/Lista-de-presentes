<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e7"><title>Gisele & Anderson — Convite</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1e7}body{overflow:hidden;color:#394636;font-family:'Cormorant Garamond',Georgia,serif}.page{position:relative;width:min(100vw,560px);height:100dvh;min-height:680px;margin:auto;overflow:hidden;background:#f5f1e7}
/* FOTO REAL: grande no alto, como o modelo, com dissolução suave */
.photo{position:absolute;left:0;top:0;width:100%;height:59%;object-fit:cover;object-position:center 30%;filter:saturate(.88) contrast(.95) brightness(1.03);transform:scale(1.015);z-index:0}
.photoMix{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(247,244,235,0) 0%,rgba(247,244,235,0) 26%,rgba(247,244,235,.05) 31%,rgba(247,244,235,.30) 37%,rgba(247,244,235,.72) 43%,rgba(247,244,235,.94) 49%,rgba(247,244,235,.985) 55%,#f5f1e7 63%)}
.photoGlow{position:absolute;z-index:2;left:0;right:0;top:28%;height:30%;background:radial-gradient(ellipse at 50% 55%,rgba(255,255,255,.60),rgba(255,255,255,0) 70%);pointer-events:none}
.frame{position:absolute;inset:14px;z-index:8;border:1px solid rgba(83,96,78,.28);pointer-events:none}.frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.50)}
.content{position:absolute;inset:0;z-index:7;text-align:center}.kicker{position:absolute;top:29.5%;width:100%;margin:0;font-family:Montserrat,Arial,sans-serif;font-size:9px;letter-spacing:.45em;text-transform:uppercase;color:#74806f;font-weight:300}.names{position:absolute;top:32%;left:3%;width:94%;margin:0;font-family:'Bodoni Moda','Times New Roman',serif;font-size:clamp(54px,14.8vw,84px);line-height:.82;font-weight:400;letter-spacing:-.055em;text-transform:uppercase;color:#344231;text-shadow:0 1px 0 rgba(255,255,255,.6)}.names .amp{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:.38em;line-height:.9;letter-spacing:0;margin:8px 0 4px;font-weight:500}.swirl{position:absolute;top:37%;left:50%;width:73%;height:105px;transform:translateX(-50%);z-index:-1;opacity:.60}.swirl:before,.swirl:after{content:'';position:absolute;top:46px;width:49%;height:55px;border-top:1px solid #8b9585;border-radius:50%}.swirl:before{left:0;transform:rotate(-8deg)}.swirl:after{right:0;transform:rotate(8deg)}.swirl span{position:absolute;left:50%;top:25px;width:1px;height:82px;background:#8b9585;transform:rotate(72deg)}
.invite{position:absolute;top:51.8%;left:6%;width:88%;margin:0;font-size:clamp(20px,5.3vw,27px);line-height:1.02;color:#4b5549}.invite strong{display:block;font-weight:500;letter-spacing:.07em;text-transform:uppercase;font-size:.91em;margin-top:4px}
.divider{position:absolute;top:65%;left:9%;width:82%;height:20px;display:flex;align-items:center;justify-content:center;gap:17px;color:#7c8778}.divider:before,.divider:after{content:'';height:1px;background:rgba(92,105,88,.50);flex:1}.divider span{font-family:Montserrat,Arial,sans-serif;font-size:10px;letter-spacing:.42em;text-transform:uppercase;margin-left:.42em}.date-line{position:absolute;top:68%;left:0;width:100%;font-family:'Bodoni Moda','Times New Roman',serif;font-size:clamp(20px,5.1vw,28px);letter-spacing:.19em;color:#3c493a;text-transform:uppercase}.date-main{position:absolute;top:71.3%;left:0;width:100%;font-family:'Bodoni Moda','Times New Roman',serif;font-size:clamp(64px,16.5vw,92px);line-height:.88;letter-spacing:.01em;color:#344132;font-weight:400}.time-row{position:absolute;top:81.2%;left:14%;width:72%;height:35px;display:flex;align-items:center;justify-content:center;gap:18px}.time-row:before,.time-row:after{content:'';height:1px;width:74px;background:rgba(92,105,88,.48)}.time{font-family:'Bodoni Moda','Times New Roman',serif;font-size:23px;letter-spacing:.18em;color:#435040;margin-left:.18em}
/* botão com a linguagem do modelo */.button{position:absolute;top:86%;left:50%;transform:translateX(-50%);min-width:184px;padding:14px 34px;border:1px solid rgba(75,89,73,.52);border-radius:0;background:rgba(250,248,241,.90);color:#465345;font-family:Montserrat,Arial,sans-serif;font-size:10px;font-weight:400;letter-spacing:.34em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 18px rgba(58,70,55,.10);z-index:9}.button:active{transform:translateX(-50%) scale(.98)}.hint{position:absolute;top:92%;width:100%;font-family:Montserrat,Arial,sans-serif;font-size:7px;letter-spacing:.20em;text-transform:uppercase;color:rgba(72,85,69,.48)}
/* ornamentos botânicos finos */.bot{position:absolute;z-index:4;width:150px;height:245px;bottom:-26px;opacity:.50;pointer-events:none}.bot.left{left:-25px}.bot.right{right:-25px;transform:scaleX(-1)}.bot svg{width:100%;height:100%}.bot path,.bot ellipse{fill:none;stroke:#929b8d;stroke-width:1}.bot .leaf{fill:#b5bdaf;fill-opacity:.16}
.video-screen{display:none;position:fixed;inset:0;z-index:20;background:#111;align-items:center;justify-content:center}.video-screen.active{display:flex}video{width:100%;height:100%;object-fit:contain;background:#111}.back{position:absolute;z-index:22;top:max(18px,env(safe-area-inset-top));left:18px;border:1px solid rgba(255,255,255,.45);border-radius:50px;padding:9px 15px;color:white;background:rgba(0,0,0,.28);font:12px Arial,sans-serif}.open-pdf{position:absolute;z-index:30;left:50%;bottom:max(32px,calc(env(safe-area-inset-bottom) + 24px));transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:15px 43px;min-width:145px;border-radius:999px;border:1px solid rgba(83,105,86,.45);background:rgba(250,248,242,.97);color:#526653;text-decoration:none;text-align:center;font:500 15px Montserrat,Arial,sans-serif;letter-spacing:.16em;box-shadow:0 8px 30px rgba(0,0,0,.28);transition:opacity .5s,transform .5s}.open-pdf.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(max-height:760px){.kicker{top:26.5%}.names{top:29%}.swirl{top:34.5%}.invite{top:47%}.divider{top:60.5%}.date-line{top:63.5%}.date-main{top:66.7%}.time-row{top:76.2%}.button{top:81.7%}.hint{top:89.8%}.photo{height:61%}}
</style></head><body>
<section class="page" id="home"><img class="photo" src="foto-casal.jpg" alt=""><div class="photoMix"></div><div class="photoGlow"></div><div class="frame"></div>
<div class="bot left"><svg viewBox="0 0 150 245"><path d="M82 245C64 202 70 157 56 116 47 85 32 54 20 14"/><ellipse class="leaf" cx="30" cy="39" rx="23" ry="7" transform="rotate(42 30 39)"/><ellipse class="leaf" cx="55" cy="78" rx="24" ry="8" transform="rotate(-34 55 78)"/><ellipse class="leaf" cx="48" cy="112" rx="23" ry="7" transform="rotate(34 48 112)"/><ellipse class="leaf" cx="64" cy="150" rx="24" ry="8" transform="rotate(-32 64 150)"/><ellipse class="leaf" cx="61" cy="186" rx="23" ry="7" transform="rotate(34 61 186)"/><path d="M82 245C96 208 113 179 135 153"/></svg></div>
<div class="bot right"><svg viewBox="0 0 150 245"><path d="M82 245C64 202 70 157 56 116 47 85 32 54 20 14"/><ellipse class="leaf" cx="30" cy="39" rx="23" ry="7" transform="rotate(42 30 39)"/><ellipse class="leaf" cx="55" cy="78" rx="24" ry="8" transform="rotate(-34 55 78)"/><ellipse class="leaf" cx="48" cy="112" rx="23" ry="7" transform="rotate(34 48 112)"/><ellipse class="leaf" cx="64" cy="150" rx="24" ry="8" transform="rotate(-32 64 150)"/><ellipse class="leaf" cx="61" cy="186" rx="23" ry="7" transform="rotate(34 61 186)"/><path d="M82 245C96 208 113 179 135 153"/></svg></div>
<main class="content"><p class="kicker">Nosso casamento</p><h1 class="names">Gisele <span class="amp">&amp;</span> Anderson</h1><div class="swirl"><span></span></div><p class="invite">convidam para a celebração do seu<strong>casamento e festa comemorativa</strong></p><div class="divider"><span>Sábado</span></div><p class="date-line">05 de dezembro</p><p class="date-main">2026</p><div class="time-row"><span class="time">19:00</span></div><button class="button" id="start">Toque aqui</button><p class="hint">Toque para assistir ao convite</p></main></section>
<section class="video-screen" id="videoScreen"><button class="back" id="back">Voltar</button><video id="video" playsinline controls preload="metadata"><source src="convite.mp4" type="video/mp4"></video><a class="open-pdf" id="pdfButton" href="convite.pdf" target="_blank" rel="noopener">Abrir</a></section>
<script>const start=document.getElementById('start'),home=document.getElementById('home'),screen=document.getElementById('videoScreen'),video=document.getElementById('video'),pdfButton=document.getElementById('pdfButton'),back=document.getElementById('back');function showOpen(){pdfButton.classList.add('show')}start.addEventListener('click',()=>{home.style.display='none';screen.classList.add('active');pdfButton.classList.remove('show');video.pause();video.currentTime=0;video.load();const p=video.play();if(p)p.catch(()=>{})});video.addEventListener('ended',showOpen);video.addEventListener('timeupdate',()=>{if(Number.isFinite(video.duration)&&video.duration>0&&video.currentTime>=video.duration-.2)showOpen()});back.addEventListener('click',()=>{video.pause();screen.classList.remove('active');home.style.display='block';pdfButton.classList.remove('show')});</script></body></html>
